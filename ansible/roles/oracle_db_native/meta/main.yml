galaxy_info:
  role_name: oracle_db_native
  author: Stefan Oehrli
  description: >-
    Native Oracle Database 19c EE (CDB19) and Oracle AI Database 26ai EE (CDB26)
    on one OL8 host - homes via AutoUpgrade (19c through db19_engineering), data
