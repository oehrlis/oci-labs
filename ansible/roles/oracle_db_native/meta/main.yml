    Data Safe on-premises connector as systemd service registered in OraDBA.
    The demo environment for LRN6087.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "8"
  galaxy_tags:
