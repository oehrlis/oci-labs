# Name.......: tasks/odb_datasafe.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.10.20
# Version....: v0.2.0
# Purpose....: Install the odb_datasafe release and its .env for the demo compartment.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Create the odb_datasafe base directory
  ansible.builtin.file:
    path: "{{ oradb_odb_datasafe_base }}"
    state: directory
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
    mode: "0755"
  become: true

- name: Download the odb_datasafe release (checksum pinned)
  ansible.builtin.get_url:
    url: "{{ oradb_odb_datasafe_url }}"
    dest: "/tmp/odb_datasafe-{{ oradb_odb_datasafe_version }}.tar.gz"
    checksum: "sha256:{{ oradb_odb_datasafe_sha256 }}"
    mode: "0644"
  become: true

# Version-aware instead of "creates": a bump (1.2.1 -> 1.3.0) must unpack over
# the existing tree. The .env lives outside the tarball and survives.
- name: Read the installed odb_datasafe version
  ansible.builtin.command: "awk '/^version:/ {print $2}' {{ oradb_odb_datasafe_base }}/.extension"
  register: oradb_odb_installed
  changed_when: false
  failed_when: false
  become: true

- name: Unpack odb_datasafe {{ oradb_odb_datasafe_version }}
  ansible.builtin.unarchive:
    src: "/tmp/odb_datasafe-{{ oradb_odb_datasafe_version }}.tar.gz"
    dest: "{{ oradb_odb_datasafe_base }}"
    remote_src: true
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
  when: (oradb_odb_installed.stdout | default('') | trim) != (oradb_odb_datasafe_version | string)
  become: true

- name: Report the odb_datasafe version
  ansible.builtin.debug:
    msg: >-
      odb_datasafe {{ oradb_odb_datasafe_version }} in {{ oradb_odb_datasafe_base }}
      (was: {{ oradb_odb_installed.stdout | default('', true) | trim or 'not installed' }})

- name: Write the odb_datasafe .env (no secrets, compartment and connector only)
  ansible.builtin.template:
    src: odb_datasafe.env.j2
    dest: "{{ oradb_odb_datasafe_base }}/.env"
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
    mode: "0640"
  become: true

- name: Put odb_datasafe on the PATH of the oracle user
  ansible.builtin.blockinfile:
    path: "/home/{{ oracle_os_user }}/.bashrc"
    marker: "# {mark} oracle_db_native - odb_datasafe (oci-labs)"
    block: |
      export ODB_DATASAFE_BASE={{ oradb_odb_datasafe_base }}
      export PATH={{ oradb_odb_datasafe_base }}/bin:{{ oradb_oci_cli_venv }}/bin:$PATH
      export JAVA_HOME={{ oradb_java_home }}
      export LANG=en_US.UTF-8
      {% if oradb_instance_principal | bool %}
      export OCI_CLI_AUTH=instance_principal
      {% endif %}
  become: true

# Instance principal path only: OCI CLI for ds_connector_create.sh.
- name: Install the OCI CLI into a venv
  ansible.builtin.pip:
    name: oci-cli
    virtualenv: "{{ oradb_oci_cli_venv }}"
    virtualenv_command: "{{ oradb_python3 }} -m venv"
  when: oradb_instance_principal | bool
  become: true

- name: Create the OCI CLI config directory of the oracle user
  ansible.builtin.file:
    path: "/home/{{ oracle_os_user }}/.oci"
    state: directory
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
    mode: "0700"
  when: oradb_instance_principal | bool
  become: true

# odb_datasafe always passes --config-file/--profile. With instance principal
# auth the profile carries the region only - there is no key on this host.
- name: Write a key-less OCI CLI profile (region only)
  ansible.builtin.copy:
    dest: "/home/{{ oracle_os_user }}/.oci/config"
    content: |
      [DEFAULT]
      region={{ oradb_region }}
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
    mode: "0600"
  when: oradb_instance_principal | bool
  become: true
