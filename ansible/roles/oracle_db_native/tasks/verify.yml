# Purpose....: Read-only checks of the demo host.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Collect the service states
  ansible.builtin.service_facts:

- name: List the PDBs per CDB
  ansible.builtin.command: "/usr/local/bin/dsdemo-pdb --db {{ item.sid }} list"
  loop: "{{ oradb_databases }}"
  loop_control:
    label: "{{ item.sid }}"
  register: oradb_pdb_list
  changed_when: false
  become: true

- name: Verify the Data Safe service accounts per CDB
  ansible.builtin.command: "/usr/local/bin/dsdemo-pdb --db {{ item.sid }} check --all"
  loop: "{{ oradb_databases }}"
  loop_control:
    label: "{{ item.sid }}"
  register: oradb_ds_check
  changed_when: false
  failed_when: false
  become: true

- name: Read the listener services
  ansible.builtin.command:
    cmd: "{{ oradb26_home }}/bin/lsnrctl status {{ oradb_listener_name }}"
  environment:
    ORACLE_HOME: "{{ oradb26_home }}"
    TNS_ADMIN: "{{ oradb26_home }}/network/admin"
  register: oradb_lsnr
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ oracle_os_user }}"

- name: Connector status via OraDBA
  ansible.builtin.command: /usr/local/bin/dsdemo-connector status
  register: oradb_dsctl_status
  changed_when: false
  failed_when: false
  become: true

- name: Report the demo host state
  vars:
    oradb_connector_unit: "oracle_datasafe_{{ oradb_connector_name }}.service"
  ansible.builtin.debug:
    msg:
      - "Listener {{ oradb_net_host }}:{{ oradb_listener_port }}: {{ 'up' if oradb_lsnr.rc == 0 else 'DOWN' }}"
      - "Listener services: {{ oradb_lsnr.stdout_lines | default([]) | select('search', '^Service \"') | list }}"
      - "PDBs: {{ oradb_pdb_list.results | map(attribute='stdout_lines') | flatten | select('search', 'READ') | list }}"
      - "DS user check: {{ oradb_ds_check.results | map(attribute='rc') | list }} (0 = ok, per CDB)"
      - "Connector service: {{ ansible_facts['services'][oradb_connector_unit]['state'] | default('not installed') }}"
      - "Connector via OraDBA: {{ oradb_dsctl_status.stdout_lines | default([]) | last | default('n/a') }}"

- name: Fail when the listener is down or a Data Safe user check failed
  ansible.builtin.assert:
    that:
      - oradb_lsnr.rc == 0
      - oradb_ds_check.results | map(attribute='rc') | select('ne', 0) | list | length == 0
    fail_msg: "Listener down or ds_database_prereqs.sh --check failed - see the report above."
    quiet: true
