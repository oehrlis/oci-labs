---
# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: defaults/main.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.08.19
# Version....: v0.1.0
# Purpose....: Default variables for the db19_engineering role.
# Notes......: oracle_sid, oracle_base, db_base_ru, db_target_ru,
#              oracle_home_base and oracle_home_target are normally supplied
#              by the Terraform-generated inventory (cpu-patch-test stack).
#              The defaults here keep the role runnable standalone.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Oracle release / patch level
# ------------------------------------------------------------------------------

# IMPORTANT: AutoUpgrade's MOS download only offers the CURRENT and the PREVIOUS
# Release Update. Verified against AutoUpgrade 26.5 on 2026-08-19:
#   RU:19.26 .. RU:19.30  -> "Cannot find the latest Release Update"
#   RU:19.31, RU:19.32    -> resolved
# So the lab patches previous RU -> current RU. Each quarter, shift both by one.

# Base Release Update the lab database is installed with (previous RU).
db_base_ru: "19.31"

# Target Release Update the CPU test patches to (out-of-place).
db_target_ru: "19.32"

# Oracle major release - drives AutoUpgrade target_version and patch names.
db19_major_release: "19"

# Edition: EE or SE2
db19_edition: "EE"

# ------------------------------------------------------------------------------
# Filesystem layout
# ------------------------------------------------------------------------------

# Three roots, deliberately separate directories even though they currently live
# on one filesystem. Keeping them apart means any of them can be moved onto a
# dedicated LVM / block volume later without touching a single path in this role.
#   /u00  ORACLE_BASE and the Oracle binaries
#   /u01  data - datafiles
#   /u02  archive - archived redo and the fast recovery area
oracle_root: /u00
oracle_data: /u01
oracle_arch: /u02

oracle_base: "{{ oracle_root }}/app/oracle"
oracle_inventory: "{{ oracle_root }}/app/oraInventory"

# ORACLE_HOMEs. Mirrors the Terraform locals so both layers agree.
oracle_home_base: "{{ oracle_base }}/product/{{ db_base_ru }}/dbhome_1"
oracle_home_target: "{{ oracle_base }}/product/{{ db_target_ru }}/dbhome_1"

# Staging area for AutoUpgrade downloads (base image + RU patches).
db19_stage_dir: /opt/stage

# Minimum free space in GB required below oracle_base before an install runs.
db19_min_free_gb: 25

# Grow the root filesystem to fill the boot volume. The OCI Oracle Linux 8 image
# partitions only ~45 GB regardless of the volume size, so a 200 GB boot volume
# leaves ~154 GB unpartitioned and only ~23 GB free below ORACLE_BASE - not
# enough for two ORACLE_HOMEs plus install media. oci-growfs extends the
# partition, the logical volume, and the filesystem in one step.
db19_grow_root_filesystem: true
db19_growfs_command: /usr/libexec/oci-growfs

# ------------------------------------------------------------------------------
# OS user and groups
# ------------------------------------------------------------------------------
# The oracle-database-preinstall-19c RPM creates the user and groups, the
# kernel parameters, and the limits entries. The role only verifies and
# supplements what the RPM leaves out.

oracle_os_user: oracle

# Passwordless sudo for these users. AutoUpgrade's ROOTSH stage runs root.sh and
# orainstRoot.sh itself when the software owner can sudo without a password -
# Oracle: "AutoUpgrade runs the root.sh script if the Oracle software owner has
# sudo privileges. Otherwise, the user performing the installation must run
# root.sh manually." opc already has it from cloud-init; oracle does not.
# Broad NOPASSWD is deliberate for a throw-away lab - narrow it for anything
# longer-lived.
db19_sudo_nopasswd_users:
  - oracle
  - opc
oracle_os_group_install: oinstall
oracle_os_group_dba: dba
oracle_os_group_oper: oper

# ------------------------------------------------------------------------------
# OS packages
# ------------------------------------------------------------------------------

# Does the heavy lifting: users, groups, sysctl, limits, required libraries.
db19_preinstall_package: oracle-database-preinstall-19c

# Additional packages the lab needs on top of the preinstall RPM. All of these
# are in the base OL8 repositories - a missing one is a hard failure.
db19_extra_packages:
  - unzip
  - zip
  - tar
  - gzip
  - hostname
  - which
  - lsof

# Convenience only. rlwrap (sqlplus line editing) lives in EPEL, which is not
# enabled on a stock OL8 image. Absence is reported, never fatal - a comfort
# tool must not block an Oracle install.
db19_optional_packages:
  - rlwrap

# Java for AutoUpgrade. Needed before any ORACLE_HOME exists, so the JDK
# shipped inside ORACLE_HOME is not yet available on a fresh host.
# Oracle documents AutoUpgrade as "compatible with JDK 8 to JDK 11" - do not
# raise this to 17 without testing.
db19_java_package: java-11-openjdk-headless
db19_java_bin: /usr/bin/java
db19_java_min_major: 8

# Oracle Linux 8 ships Python 3.6, which ansible-core 2.18+ no longer supports on
# a managed node. python3.11 comes from ol8_appstream. This is only the Ansible
# control interpreter - it has nothing to do with the Oracle installation.
db19_python_package: python3.11

# expect is required once, to drive the interactive AutoUpgrade -load_password
# prompt. Oracle exposes no flag or environment variable for MOS credentials.
db19_expect_package: expect

# ------------------------------------------------------------------------------
# AutoUpgrade
# ------------------------------------------------------------------------------

db19_autoupgrade_dir: /opt/autoupgrade
db19_autoupgrade_jar: "{{ db19_autoupgrade_dir }}/autoupgrade.jar"
db19_autoupgrade_url: "https://download.oracle.com/otn-pub/otn_software/autoupgrade.jar"

# AutoUpgrade working directories
db19_autoupgrade_log_dir: "{{ oracle_base }}/cfgtoollogs/autoupgrade"
db19_autoupgrade_config_dir: "{{ oracle_base }}/etc/autoupgrade"
db19_autoupgrade_keystore_dir: "{{ oracle_base }}/etc/autoupgrade/keystore"

# Platform string used in the AutoUpgrade download/create_home config.
db19_autoupgrade_platform: "LINUX.X64"

# Let AutoUpgrade download the media itself (needs MOS credentials in the
# keystore). Set to "no" only when everything is pre-staged in db19_stage_dir.
# NOTE: never reuse this name as a "register:" target. A registered result is a
# host fact and outranks a role default, so a task registering
# db19_autoupgrade_download silently replaced this string with the whole module
# result dict - which then landed verbatim in the generated AutoUpgrade config:
#   patch1.download={'changed': False, 'msg': 'HTTP Error 304: Not Modified', ...}
db19_autoupgrade_download: "yes"

# gold_image=AUTO uses a gold image from the Oracle Updater service when one is
# available (LINUX.X64 only) - that is the only way a 19c home can be built
# without a manually staged base image. Oracle is explicit that for 19c and 21c
# "AutoUpgrade Patching cannot automatically download this base image", so with
# gold_image=NO the file db19_base_image_zip must be present in db19_stage_dir.
# create_home only. A download job rejects this parameter entirely - AutoUpgrade
# 26.5 fails with "Failed to process the gold_image parameter for prefix dl1"
# even for the default AUTO, so the download template pins gold_image=NO.
#
# Measured on 2026-08-19, AutoUpgrade 26.5, MOS credentials verified working:
#   YES / ALL -> "Unable to find any Gold Image containing the requested patches"
#   AUTO      -> "A usable base image file is not found in <stage>"
# The real cause is server side, visible only in
# <log_dir>/cfgtoollogs/patch/auto/aru/ous.log:
#   /v2/patchplanner/registration  16 calls  OK
#   /v2/patchplanner/requests       6 calls  ALL HTTP 500
#   -> UpdaterInfoPerPrefix{latestVersion='N/A', versionToUse='N/A'}
# AutoUpgrade cannot parse the plain-text 500 body as JSON
# ("Unexpected char 73") and then reports the empty result as "no gold image".
# Until that service works, the base image must be staged via
# db19_base_image_url. AUTO is the right default: it uses a gold image when one
# is genuinely available and otherwise validates the staged base image.
db19_autoupgrade_gold_image: "AUTO"

# Try the gold-image path before falling back to individual patches plus a
# staged base image. Set to false to skip the attempt entirely.
db19_try_gold_image: true

# gold_image for the deploy (out-of-place move) job. NO on purpose - the target
# home already exists and all media are staged, so there is nothing to fetch.
db19_deploy_gold_image: "NO"
db19_base_image_zip: "LINUX.X64_193000_db_home.zip"

# AutoUpgrade CANNOT obtain the 19c base image. Verified on 2026-08-19 with
# AutoUpgrade 26.5: gold_image=YES and gold_image=ALL both report "Unable to find
# any Gold Image containing the requested patches" for RU:19.31 and RU:19.32, and
# without a gold image it stops with "A usable base image file is not found".
# The base image therefore has to come from somewhere else - set this to an OCI
# Object Storage pre-authenticated request (or any HTTP URL) holding
# db19_base_image_zip and the role stages it automatically.
# Accepts either shape:
#   bucket PAR  ".../b/orarepo/o/"                     -> filename is appended
#   object PAR  ".../o/LINUX.X64_193000_db_home.zip"   -> used verbatim
# Empty = the file must already be present in db19_stage_dir.
db19_base_image_url: ""

# Patch list for create_home. RU is pinned per home; the rest are the standard
# companions Stefan already downloads in cpu-patch-tests.
db19_autoupgrade_patch_list: "OPATCH,OJVM,DPBP"

# Minimum AutoUpgrade version for this flow. create_home arrived in 24.7, but
# home_settings.inventory_location / inventory_group - mandatory on a server
# with no /etc/oraInst.loc - only came with 25.3. Compared as major.minor.
db19_autoupgrade_min_major: 25
db19_autoupgrade_min_minor: 3

# Force a re-download of autoupgrade.jar even if the file already exists.
db19_autoupgrade_force_download: false

# My Oracle Support credentials for the AutoUpgrade patch downloads.
# NEVER hardcode these. Supply them at run time, e.g.
#   ansible-playbook ... \
#     -e mos_username="$(op read 'op://secrets/Oracle-MOS/username')" \
#     -e mos_password="$(op read 'op://secrets/Oracle-MOS/password')"
mos_username: ""
mos_password: ""

# Optional Customer Support Identifier, stored alongside the MOS user.
mos_csi: ""

# Password protecting the AutoUpgrade keystore. Only used when the keystore is
# created; auto-login (cwallet.sso) makes later runs unattended. Generated by
# Terraform - pass it in with:
#   -e db19_autoupgrade_keystore_password="$(terraform output -raw autoupgrade_keystore_password)"
db19_autoupgrade_keystore_password: ""

# Drop the Guaranteed Restore Point after a successful patch. Kept (false) so a
# failed CPU test can be rolled back and re-examined.
db19_drop_grp_after_patching: false

# ------------------------------------------------------------------------------
# Database
# ------------------------------------------------------------------------------

# Lab database name - the one knob to change per lab. Supplied by the
# Terraform variable oracle_sid via the generated inventory, or with
# -e oracle_sid=MYDB for a manual run.
oracle_sid: CPUDB

# Create as a container database with one PDB. A CDB exercises datapatch
# across CDB$ROOT, PDB$SEED and the PDB, which is what a CPU test should cover.
db19_create_as_cdb: true

# Number of user PDBs. This is the biggest single cost in create_db: datapatch
# runs against CDB$ROOT, PDB$SEED and every user PDB. 0 still exercises
# datapatch on CDB$ROOT and PDB$SEED, which is what a CPU test needs, and cuts
# roughly 10 minutes on a 2-OCPU host.
db19_number_of_pdbs: 1
db19_pdb_name: PDB1

# Archive log mode. Not required for datapatch or an out-of-place move; enable
# only when the test itself needs recoverability.
db19_enable_archivelog: false

# dbca template. General_Purpose.dbc is the seeded default template.
# General_Purpose.dbc is the seeded template shipped with the home, so the
# file-copy phase is a fast clone. TODO: oradba is to grow a set of response-file
# and dbca templates (derived from what oradba_init had); switch to those once
# available and drop the local dbca.rsp.j2.
db19_dbca_template: General_Purpose.dbc
db19_character_set: AL32UTF8
db19_listener_name: LISTENER
db19_listener_port: 1521

# Datafile and recovery locations
db19_datafile_dir: "{{ oracle_data }}/oradata"
db19_recovery_dir: "{{ oracle_arch }}/fast_recovery_area"
db19_archive_dir: "{{ oracle_arch }}/archive"
db19_recovery_size_mb: 20480
db19_redo_log_size_mb: 200

# SGA/PGA sizing - modest, this is a patch-test lab and not a benchmark.
# Sized for the 32 GB default host. Bigger SGA measurably shortens datapatch and
# PL/SQL recompilation, which dominate create_db.
db19_sga_target_mb: 8192
db19_pga_aggregate_target_mb: 2048

# SYS/SYSTEM password. Supply at run time, same pattern as the MOS credentials.
db19_sys_password: ""

# ------------------------------------------------------------------------------
# oradba environment toolset
# ------------------------------------------------------------------------------
# oradba is the runtime layer only - environment discovery, aliases, service
# and backup wrappers. It performs no OS setup and no software install; that
# is handled natively by this role.

db19_oradba_enabled: true

# oradba ships a self-contained installer as a GitHub release asset. That is the
# documented install path - do NOT clone the repository and run something from
# it; the repo is the source tree, and its installer is built, not committed.
db19_oradba_release: latest
db19_oradba_install_url: >-
  https://github.com/oehrlis/oradba/releases/{{ db19_oradba_release }}/download/oradba_install.sh
db19_oradba_check_url: >-
  https://github.com/oehrlis/oradba/releases/{{ db19_oradba_release }}/download/oradba_check.sh

# Installation prefix passed to the installer via --prefix. Inside ORACLE_BASE
# so it follows the Oracle lifecycle and moves with the base directory.
db19_oradba_dir: "{{ oracle_base }}/local/oradba"

# Run the optional prerequisite checker before installing.
db19_oradba_run_check: true

# Re-run the oradba installer even when it is already present.
db19_oradba_force_install: false

# systemd unit that starts listeners and databases on boot via oradba's own
# wrapper. Without it the database stays down after a reboot even though oratab
# says :Y - nothing calls dbstart.
db19_service_enabled: true
db19_service_name: oradba-services
db19_service_stop_timeout: 300

# ------------------------------------------------------------------------------
# Oracle Linux 8 workarounds
# ------------------------------------------------------------------------------
# Oracle 19c prerequisite checks reject OL8. oradba_init used OEL7.6, the
# tvd-cpureport cloud-init used OEL7.9 - both are accepted by the installer.
db19_cv_assume_distid: OEL7.9

# Relink with Unified Auditing enabled. AutoUpgrade exposes this as a binary
# option, so no manual "make -f ins_rdbms.mk uniaud_on ioracle" is needed.
db19_enable_unified_audit: true

# SELinux. Oracle's own AutoUpgrade walkthrough for a fresh OL8 server sets
# SELINUX=disabled and reboots. "permissive" is the softer choice that still
# logs denials; set to "enforcing" to leave the OCI image default untouched and
# accept the risk of installer failures.
db19_selinux_state: permissive
db19_selinux_reboot: true
