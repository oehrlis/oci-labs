# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: tasks/assert_vars.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.11.18
# Version....: v0.3.0
# Purpose....: Fail fast on missing or contradictory role input.
# Notes......: Runs under the "always" tag so a step-by-step run on a test VM
#              is validated the same way as a full run.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Assert the lab database name is set and valid
  ansible.builtin.assert:
    that:
      - oracle_sid is defined
      - oracle_sid | length > 0
      - oracle_sid | length <= 12
      - oracle_sid is match('^[A-Za-z][A-Za-z0-9]*$')
    fail_msg: >-
      oracle_sid must be 1-12 alphanumeric characters starting with a letter,
      got "{{ oracle_sid | default('') }}". Set it per lab via the Terraform
      variable oracle_sid or -e oracle_sid=MYDB.
    success_msg: "Lab database name: {{ oracle_sid }}"

# Release and RU strings must agree: 26ai RUs start with 23, 19c RUs with 19.
# Without this a 26ai inventory that forgot db_release would run as 19.
- name: Assert the release matches the Release Updates
  ansible.builtin.assert:
    that:
      - db_release | string in db_release_profiles
      - (db_base_ru | string).split('.')[0] == db_release_profile.ru_prefix
      - (db_target_ru | string).split('.')[0] == db_release_profile.ru_prefix
    fail_msg: >-
      db_release "{{ db_release }}" does not fit the RUs {{ db_base_ru }} ->
      {{ db_target_ru }}. Releases are 19 and 26; 26ai RU strings start with 23.
    success_msg: "Release {{ db_release }}, RUs {{ db_base_ru }} -> {{ db_target_ru }}."

# The RUs may come from cpu-patch-tests' lab profile (-e @file) while the homes
# still come from the Terraform inventory. A new profile against old tfvars would
# patch into the previous quarter's home without a word.
- name: Assert the target home fits the target Release Update
  ansible.builtin.assert:
    that:
      - (db_target_ru | string) in oracle_home_target
    fail_msg: >-
      oracle_home_target {{ oracle_home_target }} does not carry the target RU
      {{ db_target_ru }}. Update db_target_ru / db_oracle_home_target in the
      Terraform tfvars and apply (inventory only), or pass -e oracle_home_target=...
    success_msg: "Target home {{ oracle_home_target }} fits RU {{ db_target_ru }}."

# Seed mode builds one home and a gold image from it - nothing is patched, so a
# patch, verify or rollback in the same run would test a home against itself.
# "all" is a run without --tags, which includes the patch phase.
- name: Refuse patch steps in seed mode
  ansible.builtin.assert:
    that:
      - ansible_run_tags | intersect(['all', 'patch', 'verify', 'rollback']) | length == 0
    fail_msg: >-
      db19_seed_mode builds a base home and its gold image only (tags install,
      goldimage_push or single install tags). Got tags {{ ansible_run_tags }} -
      run patch/verify/rollback without db19_seed_mode.
    success_msg: "Seed mode: install-only run at RU {{ db_base_ru }}"
  when: db19_seed_mode | bool

# The seed overrides beat role defaults and inventory, not extra vars - an
# explicit -e still wins, on purpose.
- name: Build the seed home without an Oracle gold image
  ansible.builtin.set_fact:
    db19_try_gold_image: false
    db19_autoupgrade_gold_image: "NO"
    db19_autoupgrade_download: "no"
  when: db19_seed_mode | bool

- name: Assert the base and target Release Updates differ
  ansible.builtin.assert:
    that:
      - db_base_ru is defined
      - db_target_ru is defined
      - db_base_ru != db_target_ru
    fail_msg: >-
      db_base_ru and db_target_ru must both be set and must differ - an
      out-of-place patch test needs two distinct Release Updates
      (got base "{{ db_base_ru | default('') }}",
      target "{{ db_target_ru | default('') }}").
    success_msg: "Patch path: {{ db_base_ru }} -> {{ db_target_ru }}"
  when: not (db19_seed_mode | bool)

- name: Assert the two ORACLE_HOME paths differ
  ansible.builtin.assert:
    that:
      - oracle_home_base != oracle_home_target
    fail_msg: >-
      oracle_home_base and oracle_home_target must differ - out-of-place
      patching installs the target RU into a separate home.
    success_msg: "Base home {{ oracle_home_base }}, target home {{ oracle_home_target }}"
  when: not (db19_seed_mode | bool)

- name: Assert the date_time fact is available
  ansible.builtin.assert:
    that:
      - ansible_facts['date_time'] is defined
      - ansible_facts['date_time']['date'] | default('') | length > 0
    fail_msg: >-
      The date_time fact is missing - run with gather_facts enabled. Two
      artifact names are built from it (the cputest report stem and the gold
      image name) and neither carries a fallback: without the fact they render
      without a date, and the next run overwrites the previous evidence under
      the identical name instead of failing.
    success_msg: "Run date: {{ ansible_facts['date_time']['date'] }}"
