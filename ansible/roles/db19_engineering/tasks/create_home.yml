---
# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: tasks/create_home.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.08.19
# Version....: v0.1.0
# Purpose....: Create an ORACLE_HOME at a given RU via AutoUpgrade create_home.
# Notes......: Reused for both homes - the caller sets db19_home_ru and
#              db19_home_path. No runInstaller, no response file: AutoUpgrade
#              extracts the image, applies the RU and companion patches, and
#              registers the home in the inventory.
#              AutoUpgrade runs root.sh and orainstRoot.sh itself only when the
#              oracle user has passwordless sudo. It does not here, so the role
#              runs them explicitly afterwards - AutoUpgrade prints them to the
#              console and to <log_dir>/create_home_1/<job>/rootsh/rootsh.log
#              rather than blocking.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Set the home to create
  ansible.builtin.set_fact:
    db19_home_ru: "{{ db19_home_ru | default(db_base_ru) }}"
    db19_home_path: "{{ db19_home_path | default(oracle_home_base) }}"

- name: Check whether a central inventory is already registered
  become: true
  ansible.builtin.stat:
    path: /etc/oraInst.loc
  register: db19_orainst_loc

- name: Check whether the ORACLE_HOME already exists
  become: true
  ansible.builtin.stat:
    path: "{{ db19_home_path }}/bin/oracle"
  register: db19_home_stat

- name: Report that the ORACLE_HOME already exists
  ansible.builtin.debug:
    msg: >-
      {{ db19_home_path }} already contains an oracle binary - skipping
      create_home. Remove the home and deregister it from the inventory for a
      clean rebuild.
  when: db19_home_stat.stat.exists

# ---------------------------------------------------------------------------
# Installing FROM a gold image - stage the artifact the same way as the base
# image. Same reasoning as db19_base_image_url: a PAR is a bearer credential,
# so no_log and a short-lived URL.
# ---------------------------------------------------------------------------

- name: Stage the gold image from db19_gold_image_url
  become: true
  become_user: "{{ oracle_os_user }}"
  ansible.builtin.get_url:
    url: "{{ db19_gold_image_url }}"
    dest: "{{ db19_stage_dir }}/{{ db19_gold_image_file }}"
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
    mode: "0644"
    timeout: 120
  no_log: true
  register: db19_gold_image_stage
  retries: 3
  delay: 10
  until: db19_gold_image_stage is succeeded
  when:
    - not db19_home_stat.stat.exists
    - db19_gold_image_file | length > 0
    - db19_gold_image_url | length > 0

- name: Assert the gold image is present before building from it
  become: true
  ansible.builtin.stat:
    path: "{{ db19_stage_dir }}/{{ db19_gold_image_file }}"
  register: db19_gold_image_local
  when:
    - not db19_home_stat.stat.exists
    - db19_gold_image_file | length > 0

- name: Fail early when the gold image is missing
  ansible.builtin.assert:
    that:
      - db19_gold_image_local.stat.exists
    fail_msg: >-
      db19_gold_image_file is set to {{ db19_gold_image_file }} but the file is
      not in {{ db19_stage_dir }}. Set db19_gold_image_url to a
      pre-authenticated request that serves it, or copy it in by hand.
  when:
    - not db19_home_stat.stat.exists
    - db19_gold_image_file | length > 0

- name: Create the ORACLE_HOME with AutoUpgrade
  when: not db19_home_stat.stat.exists
  block:
    - name: Ensure the parent directory of the ORACLE_HOME exists
      become: true
      ansible.builtin.file:
        path: "{{ db19_home_path | dirname }}"
        state: directory
        owner: "{{ oracle_os_user }}"
        group: "{{ oracle_os_group_install }}"
        mode: "0775"

    - name: Render the create_home config for RU {{ db19_home_ru }}
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.template:
        src: autoupgrade-create-home.cfg.j2
        dest: "{{ db19_autoupgrade_config_dir }}/create-home-{{ db19_home_ru }}.cfg"
        owner: "{{ oracle_os_user }}"
        group: "{{ oracle_os_group_install }}"
        mode: "0644"

    # No -mode analyze here: analyze is the deploy-style precheck and requires a
    # sid. A create_home config has no database, so AutoUpgrade stops with
    # "No sid was specified in the user configuration file". The deploy step in
    # patch.yml does run analyze, because there a sid exists.
    - name: Create the ORACLE_HOME at RU {{ db19_home_ru }}
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.command:
        cmd: >-
          {{ db19_java_bin }} -jar {{ db19_autoupgrade_jar }}
          -config {{ db19_autoupgrade_config_dir }}/create-home-{{ db19_home_ru }}.cfg
          -patch -mode create_home -noconsole
      environment:
        ORACLE_BASE: "{{ oracle_base }}"
      register: db19_create_home
      changed_when: db19_create_home.rc == 0
      async: 14400
      poll: 60

    - name: Report the create_home outcome
      ansible.builtin.debug:
        msg: "{{ (db19_create_home.stdout_lines | default([]))[-30:] }}"

    # The artifact is the whole point of a create_gold_image run, so it gets the
    # same treatment as a resolved patch set: named, sized and checksummed rather
    # than left for someone to find in the stage directory.
    - name: Locate the gold image that was just created
      become: true
      ansible.builtin.find:
        paths: "{{ db19_stage_dir }}"
        # Matches db19_gold_image_name, not AutoUpgrade's own
        # db_home_%RELEASE%_%UPDATE%_%TIMESTAMP% template - the naming scheme is
        # ours. Keep this in step with the default when the scheme changes.
        patterns: "goldimage-db-*.zip"
        age: -1h
        get_checksum: true
        checksum_algorithm: sha256
      register: db19_gold_image_built
      when: db19_gold_image_create | bool

    - name: Report the gold image that was created
      ansible.builtin.debug:
        msg:
          - >-
            Gold image for RU {{ db19_home_ru }}:
            {{ (db19_gold_image_built.files | sort(attribute='mtime') | last).path | basename }}
          - >-
            {{ ((db19_gold_image_built.files | sort(attribute='mtime') | last).size
                / 1024 / 1024 / 1024) | round(2) }} GiB,
            sha256 {{ (db19_gold_image_built.files | sort(attribute='mtime') | last).checksum }}
          - >-
            Install a later home from it with
            db19_gold_image_file={{ (db19_gold_image_built.files | sort(attribute='mtime') | last).path | basename }}
      when:
        - db19_gold_image_create | bool
        - (db19_gold_image_built.files | default([])) | length > 0

# ---------------------------------------------------------------------------
# Root scripts - the oracle user has no passwordless sudo on this host
# ---------------------------------------------------------------------------

- name: Look for orainstRoot.sh (first install on this host only)
  become: true
  ansible.builtin.stat:
    path: "{{ oracle_inventory }}/orainstRoot.sh"
  register: db19_orainstroot

- name: Run orainstRoot.sh
  become: true
  ansible.builtin.command:
    cmd: "{{ oracle_inventory }}/orainstRoot.sh"
  register: db19_orainstroot_run
  changed_when: db19_orainstroot_run.rc == 0
  when:
    - db19_orainstroot.stat.exists
    - not db19_orainst_loc.stat.exists
    - not db19_home_stat.stat.exists

- name: Look for root.sh in the new ORACLE_HOME
  become: true
  ansible.builtin.stat:
    path: "{{ db19_home_path }}/root.sh"
  register: db19_rootsh

# root.sh is not idempotent in the reporting sense - it succeeds every time and
# would show as "changed" forever. Run it only for a home this run created.
- name: Run root.sh for the new ORACLE_HOME
  become: true
  ansible.builtin.command:
    cmd: "{{ db19_home_path }}/root.sh"
  register: db19_rootsh_run
  changed_when: db19_rootsh_run.rc == 0
  when:
    - db19_rootsh.stat.exists
    - not db19_home_stat.stat.exists

- name: Verify the ORACLE_HOME reports the expected version
  become: true
  become_user: "{{ oracle_os_user }}"
  ansible.builtin.command:
    cmd: "{{ db19_home_path }}/OPatch/opatch lsinventory -oh {{ db19_home_path }}"
  environment:
    ORACLE_HOME: "{{ db19_home_path }}"
    ORACLE_BASE: "{{ oracle_base }}"
  register: db19_home_inventory
  changed_when: false
  failed_when: false

- name: Report the patch level of the new ORACLE_HOME
  ansible.builtin.debug:
    msg: >-
      {{ db19_home_inventory.stdout_lines | default([])
         | select('search', '(?i)(Oracle Database|Release Update|Patch  *[0-9]+ *:)')
         | list }}
