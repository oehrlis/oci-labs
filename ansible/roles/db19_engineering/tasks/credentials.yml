---
# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: tasks/credentials.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.08.19
# Version....: v0.1.0
# Purpose....: Load My Oracle Support credentials into the AutoUpgrade keystore.
# Notes......: AutoUpgrade offers no flag, environment variable, or file for MOS
#              credentials - "-load_password" is an interactive prompt and is
#              the only documented interface. expect drives it once; the
#              auto-login wallet (cwallet.sso) it produces makes every later
#              AutoUpgrade run non-interactive.
#              Credentials are supplied at run time, never stored in the repo:
#                -e mos_username="$(op read 'op://secrets/Oracle-MOS/username')"
#                -e mos_password="$(op read 'op://secrets/Oracle-MOS/password')"
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Check for an existing auto-login keystore
  become: true
  ansible.builtin.stat:
    path: "{{ db19_autoupgrade_keystore_dir }}/cwallet.sso"
  register: db19_keystore_sso

- name: Report that the keystore is already usable
  ansible.builtin.debug:
    msg: >-
      Auto-login keystore present at {{ db19_autoupgrade_keystore_dir }} -
      skipping credential load. Delete cwallet.sso and ewallet.p12 to re-enter
      credentials.
  when: db19_keystore_sso.stat.exists

- name: Load MOS credentials into the keystore
  when: not db19_keystore_sso.stat.exists
  block:
    - name: Assert MOS credentials and the keystore password were supplied
      ansible.builtin.assert:
        that:
          - mos_username | length > 0
          - mos_password | length > 0
          - db19_autoupgrade_keystore_password | length >= 8
        fail_msg: >-
          mos_username and mos_password are required to create the AutoUpgrade
          keystore. Supply them at run time from 1Password, for example:
          -e mos_username="$(op read 'op://secrets/Oracle-MOS/username')"
          -e mos_password="$(op read 'op://secrets/Oracle-MOS/password')"
          -e db19_autoupgrade_keystore_password="$(terraform output -raw autoupgrade_keystore_password)"
        success_msg: "MOS credentials supplied for {{ mos_username }}."
      no_log: true

    - name: Render a download config for the keystore session
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.template:
        src: autoupgrade-download.cfg.j2
        dest: "{{ db19_autoupgrade_config_dir }}/download-{{ db19_home_ru }}.cfg"
        owner: "{{ oracle_os_user }}"
        group: "{{ oracle_os_group_install }}"
        mode: "0644"
      vars:
        db19_home_ru: "{{ db_base_ru }}"

    - name: Render the expect script
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.template:
        src: load_mos_password.exp.j2
        dest: "{{ db19_autoupgrade_dir }}/load_mos_password.exp"
        owner: "{{ oracle_os_user }}"
        group: "{{ oracle_os_group_install }}"
        mode: "0700"
      vars:
        db19_home_ru: "{{ db_base_ru }}"
      no_log: true

    - name: Populate the AutoUpgrade keystore with MOS credentials
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.command:
        cmd: "/usr/bin/expect -f {{ db19_autoupgrade_dir }}/load_mos_password.exp"
      environment:
        ORACLE_BASE: "{{ oracle_base }}"
      register: db19_keystore_load
      changed_when: db19_keystore_load.rc == 0
      no_log: true

  always:
    - name: Remove the expect script
      become: true
      ansible.builtin.file:
        path: "{{ db19_autoupgrade_dir }}/load_mos_password.exp"
        state: absent

- name: Verify the auto-login keystore now exists
  become: true
  ansible.builtin.stat:
    path: "{{ db19_autoupgrade_keystore_dir }}/cwallet.sso"
  register: db19_keystore_verify

- name: Assert the keystore is in auto-login mode
  ansible.builtin.assert:
    that:
      - db19_keystore_verify.stat.exists
    fail_msg: >-
      No cwallet.sso in {{ db19_autoupgrade_keystore_dir }}. The keystore was
      not saved in auto-login mode, so later AutoUpgrade runs will prompt and
      hang. Re-run this step, or load the credentials by hand with:
      {{ db19_java_bin }} -jar {{ db19_autoupgrade_jar }}
      -config <cfg> -patch -load_password
    success_msg: "Keystore is in auto-login mode - AutoUpgrade can run unattended."
