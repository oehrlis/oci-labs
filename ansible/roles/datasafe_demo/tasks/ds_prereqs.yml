# --all = C##DS_ADMIN in CDB$ROOT plus DS_ADMIN in every OPEN READ WRITE PDB.
# The secret travels on stdin into dsdemo-pdb, never as an argument.
- name: Create the Data Safe service accounts (C##DS_ADMIN / DS_ADMIN)
  ansible.builtin.command: /usr/local/bin/dsdemo-pdb prereqs --all
  args:
    stdin: "{{ dsdemo_ds_secret }}"
    stdin_add_newline: false
  register: dsdemo_prereqs
  # ds_database_prereqs.sh is idempotent (create if missing, align profile and
  # grants otherwise) and does not report what it changed.
  changed_when: true
  no_log: true
  become: true

- name: Show the prereqs result without the secret
  ansible.builtin.debug:
    msg: "{{ dsdemo_prereqs.stdout_lines | default([]) | select('search', 'INFO|WARN|ERROR|OK|PDB') | list }}"
