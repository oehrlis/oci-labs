# Version....: v0.1.0
# Purpose....: Data Safe on-premises connector and its systemd service.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

# Two paths, decided by dsdemo_instance_principal (Terraform enable_instance_principal):
#   true  - ds_connector_create.sh on the host: OCI create, bundle download,
#           setup.py install. Needs the dynamic group + policy.
#   false - bundle created on the laptop and copied to dsdemo_connector_bundle_dir
#           as <name>.zip and <name>_pwd.b64 (docs/datasafe-demo.md, fallback).
# Both end in install_datasafe_service.sh --prepare / --install.

- name: Check whether the connector is already installed
  ansible.builtin.stat:
    path: "{{ dsdemo_connector_home }}/setup.py"
  register: dsdemo_connector_installed

- name: Create and install the connector with ds_connector_create.sh (instance principal)
  ansible.builtin.command:
    argv:
      - "{{ dsdemo_odb_datasafe_base }}/bin/ds_connector_create.sh"
      - -c
      - "{{ dsdemo_compartment_ocid }}"
      - -N
      - "{{ dsdemo_connector_name }}"
      - --connector-home
      - "{{ dsdemo_connector_home }}"
      - --connector-port
      - "{{ dsdemo_connector_port | string }}"
      - --description
      - "LRN6087 Data Safe demo connector (oci-labs datasafe-demo)"
  environment:
    ODB_DATASAFE_BASE: "{{ dsdemo_odb_datasafe_base }}"
    OCI_CLI_AUTH: instance_principal
    PATH: "{{ dsdemo_oci_cli_venv }}/bin:/usr/local/bin:/usr/bin:/bin"
    LANG: en_US.UTF-8
  when:
    - dsdemo_instance_principal | bool
    - not dsdemo_connector_installed.stat.exists
  changed_when: true
  become: true
  become_user: "{{ dsdemo_os_user }}"

- name: Look for a copied connector bundle (fallback path)
  ansible.builtin.stat:
    path: "{{ dsdemo_connector_bundle_dir }}/{{ dsdemo_connector_name }}.zip"
  register: dsdemo_connector_bundle
  when: not (dsdemo_instance_principal | bool)

- name: Report the missing bundle instead of skipping silently
  ansible.builtin.debug:
    msg:
      - "SKIPPED connector install: no bundle at {{ dsdemo_connector_bundle_dir }}/{{ dsdemo_connector_name }}.zip"
      - "Create it on the laptop (docs/datasafe-demo.md, 'Connector ohne Instance Principal'),"
      - "copy it plus {{ dsdemo_connector_name }}_pwd.b64, then run: make dsdemo-step TAG=connector"
  when:
    - not (dsdemo_instance_principal | bool)
    - not dsdemo_connector_installed.stat.exists
    - not dsdemo_connector_bundle.stat.exists

- name: Install from the copied bundle (fallback path)
  when:
    - not (dsdemo_instance_principal | bool)
    - not dsdemo_connector_installed.stat.exists
    - dsdemo_connector_bundle.stat.exists
  become: true
  block:
    - name: Create the connector home
      ansible.builtin.file:
        path: "{{ dsdemo_connector_home }}"
        state: directory
        owner: "{{ dsdemo_os_user }}"
        group: "{{ dsdemo_os_group }}"
        mode: "0750"

    - name: Unpack the connector bundle
      ansible.builtin.unarchive:
        src: "{{ dsdemo_connector_bundle_dir }}/{{ dsdemo_connector_name }}.zip"
        dest: "{{ dsdemo_connector_home }}"
        remote_src: true
        owner: "{{ dsdemo_os_user }}"
        group: "{{ dsdemo_os_group }}"

    - name: Install the non-interactive setup wrapper
      ansible.builtin.copy:
        src: connector_setup.py
        dest: "{{ dsdemo_connector_home }}/dsdemo_connector_setup.py"
        owner: "{{ dsdemo_os_user }}"
        group: "{{ dsdemo_os_group }}"
        mode: "0750"

    - name: Run setup.py install with the bundle key
      ansible.builtin.command:
        argv:
          - "{{ dsdemo_python3 }}"
          - "{{ dsdemo_connector_home }}/dsdemo_connector_setup.py"
          - "{{ dsdemo_connector_home }}/setup.py"
          - "{{ dsdemo_connector_bundle_dir }}/{{ dsdemo_connector_name }}_pwd.b64"
          - "{{ dsdemo_connector_port | string }}"
        chdir: "{{ dsdemo_connector_home }}"
      changed_when: true
      become: true
      become_user: "{{ dsdemo_os_user }}"

- name: Re-check the connector installation
  ansible.builtin.stat:
    path: "{{ dsdemo_connector_home }}/setup.py"
  register: dsdemo_connector_ready

- name: Prepare the systemd service (install_datasafe_service.sh --prepare)
  ansible.builtin.command:
    argv:
      - "{{ dsdemo_odb_datasafe_base }}/bin/install_datasafe_service.sh"
      - --prepare
      - -n
      - "{{ dsdemo_connector_name }}"
      - -b
      - "{{ dsdemo_oracle_base }}/product"
      - -u
      - "{{ dsdemo_os_user }}"
      - -g
      - "{{ dsdemo_os_dba_group }}"
      - -j
      - "{{ dsdemo_java_home }}"
      - -y
  environment:
    ORACLE_BASE: "{{ dsdemo_oracle_base }}"
  when: dsdemo_connector_ready.stat.exists
  changed_when: true
  become: true
  become_user: "{{ dsdemo_os_user }}"

- name: Install the systemd service (install_datasafe_service.sh --install)
  ansible.builtin.command:
    argv:
      - "{{ dsdemo_odb_datasafe_base }}/bin/install_datasafe_service.sh"
      - --install
      - -n
      - "{{ dsdemo_connector_name }}"
      - -b
      - "{{ dsdemo_oracle_base }}/product"
      - -u
      - "{{ dsdemo_os_user }}"
      - -g
      - "{{ dsdemo_os_dba_group }}"
      - -j
      - "{{ dsdemo_java_home }}"
      - -y
  environment:
    ORACLE_BASE: "{{ dsdemo_oracle_base }}"
  args:
    creates: "/etc/systemd/system/oracle_datasafe_{{ dsdemo_connector_name }}.service"
  when: dsdemo_connector_ready.stat.exists
  become: true

- name: Enable and start the connector service
  ansible.builtin.systemd_service:
    name: "oracle_datasafe_{{ dsdemo_connector_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  when: dsdemo_connector_ready.stat.exists
  become: true
