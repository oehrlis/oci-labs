# Tags, in run order:
#   prereq        OS packages, python3.11, Java, oracle user, directories
#   odb_datasafe  odb_datasafe release + .env (before the container: the
#                 container mounts it read-only for ds_database_prereqs.sh)
#   container     oracle-free-labs image, systemd unit, first DB creation, PDBs
#   ds_prereqs    Data Safe service account in CDB$ROOT and every open PDB
#   connector     Data Safe on-premises connector + systemd service
#   verify        read-only checks
# Coarse tag "install" runs all of them.

- name: Assert the required inputs
  ansible.builtin.import_tasks: assert_vars.yml
  tags:
    - always

- name: OS prerequisites
  ansible.builtin.import_tasks: os.yml
  tags:
    - install
    - prereq

- name: Install odb_datasafe
  ansible.builtin.import_tasks: odb_datasafe.yml
  tags:
    - install
    - odb_datasafe

- name: Free container and PDBs
  ansible.builtin.import_tasks: container.yml
  tags:
    - install
    - container

- name: Data Safe service accounts
  ansible.builtin.import_tasks: ds_prereqs.yml
  tags:
    - install
    - ds_prereqs

- name: Data Safe on-premises connector
  ansible.builtin.import_tasks: connector.yml
  tags:
    - install
    - connector

- name: Verify
  ansible.builtin.import_tasks: verify.yml
  tags:
    - install
    - verify
