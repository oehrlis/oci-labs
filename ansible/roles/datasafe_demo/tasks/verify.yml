- name: Collect the service states
  ansible.builtin.service_facts:

- name: Fail when the database container unit is not running
  ansible.builtin.assert:
    that:
      - ansible_facts['services']['dsdemo-db.service']['state'] | default('missing') == 'running'
    fail_msg: "dsdemo-db.service is not running - check: sudo journalctl -u dsdemo-db -n 100"
    quiet: true

- name: List the PDBs
  ansible.builtin.command: /usr/local/bin/dsdemo-pdb list
  register: dsdemo_pdb_list
  changed_when: false
  become: true

- name: Verify the Data Safe service accounts
  ansible.builtin.command: /usr/local/bin/dsdemo-pdb check --all
  register: dsdemo_ds_check
  changed_when: false
  become: true

- name: Report the demo host state
  vars:
    dsdemo_connector_unit: "oracle_datasafe_{{ dsdemo_connector_name }}.service"
  ansible.builtin.debug:
    msg:
      - "Database unit: {{ ansible_facts['services']['dsdemo-db.service']['state'] }}"
      - "Connector service: {{ ansible_facts['services'][dsdemo_connector_unit]['state'] | default('not installed') }}"
      - "Listener: {{ dsdemo_host_private_ip }}:{{ dsdemo_listener_port }}"
      - "PDBs: {{ dsdemo_pdb_list.stdout_lines | select('search', 'READ') | list }}"
      - "DS user check: {{ 'ok' if dsdemo_ds_check.rc == 0 else 'FAILED' }}"
