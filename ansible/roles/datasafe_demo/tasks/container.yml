# Version....: v0.1.0
# Purpose....: Oracle AI Database 26ai Free container (oracle-free-labs) with the demo PDBs.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

# Mirrors the odbseed service of oracle-free-labs/docker-compose.yml (same
# image, same common scripts, same mount points), but runs as a systemd unit
# instead of compose: rootful podman has no daemon, and a unit is what brings
# the database back after every VM stop/start - the cost-saving routine.

- name: Clone oracle-free-labs (image build context and common scripts)
  ansible.builtin.git:
    repo: "{{ dsdemo_free_labs_repo }}"
    dest: "{{ dsdemo_free_labs_dir }}"
    version: "{{ dsdemo_free_labs_version }}"
    depth: 1
  become: true

- name: Check whether the demo image exists
  ansible.builtin.command: "podman image exists {{ dsdemo_image if dsdemo_build_image | bool else dsdemo_base_image }}"
  register: dsdemo_image_exists
  changed_when: false
  failed_when: dsdemo_image_exists.rc not in [0, 1]
  become: true

- name: Build the oracle-free-labs image on top of the 26ai Free base image
  ansible.builtin.command:
    argv:
      - podman
      - build
      - --build-arg
      - "DB_IMAGE={{ dsdemo_base_image }}"
      - -t
      - "{{ dsdemo_image }}"
      - -f
      - "{{ dsdemo_free_labs_dir }}/build/Dockerfile"
      - "{{ dsdemo_free_labs_dir }}/build"
  when:
    - dsdemo_build_image | bool
    - dsdemo_image_exists.rc != 0
  changed_when: true
  become: true

- name: Pull the 26ai Free base image (no build)
  ansible.builtin.command: "podman pull {{ dsdemo_base_image }}"
  when:
    - not (dsdemo_build_image | bool)
    - dsdemo_image_exists.rc != 0
  changed_when: true
  become: true

- name: Create the container data directories (owned by the container oracle user)
  ansible.builtin.file:
    path: "{{ dsdemo_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ dsdemo_os_uid }}"
    group: "{{ dsdemo_os_gid }}"
    mode: "0755"
  loop:
    - oradata
    - dbconfig
    - logs
    - setup
    - startup
    - pdbarch
  become: true

- name: Install the one-time PDB setup script
  ansible.builtin.template:
    src: 10_create_demo_pdbs.sh.j2
    dest: "{{ dsdemo_data_dir }}/setup/10_create_demo_pdbs.sh"
    owner: "{{ dsdemo_os_uid }}"
    group: "{{ dsdemo_os_gid }}"
    mode: "0755"
  become: true

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/dsdemo
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Write the container environment file (ORACLE_PWD, root only)
  ansible.builtin.template:
    src: dsdemo-db.env.j2
    dest: /etc/dsdemo/dsdemo-db.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  become: true

- name: Install the systemd unit for the database container
  ansible.builtin.template:
    src: dsdemo-db.service.j2
    dest: /etc/systemd/system/dsdemo-db.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  become: true

- name: Reload systemd before the first start
  ansible.builtin.meta: flush_handlers

- name: Enable and start the database container
  ansible.builtin.systemd_service:
    name: dsdemo-db.service
    enabled: true
    state: started
  become: true

- name: Install the host helpers dsdemo-sql and dsdemo-pdb
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - dsdemo-sql
    - dsdemo-pdb
  become: true

# The healthcheck turns healthy once the CDB is open; the setup script may
# still be creating PDBs. Wait for all demo PDBs in READ WRITE instead.
- name: Wait until every demo PDB is open READ WRITE (first start takes 10-15 minutes)
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/dsdemo-sql <<'SQL' | tr -d '[:space:]'
    set heading off feedback off pagesize 0
    select count(*) from v$pdbs where name in ('{{ dsdemo_pdbs | join("','") }}') and open_mode = 'READ WRITE';
    SQL
  args:
    executable: /bin/bash
  register: dsdemo_pdb_count
  until: dsdemo_pdb_count.stdout == (dsdemo_pdbs | length | string)
  retries: "{{ dsdemo_db_wait_retries }}"
  delay: "{{ dsdemo_db_wait_delay }}"
  changed_when: false
  become: true
