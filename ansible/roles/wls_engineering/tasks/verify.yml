---
# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: tasks/verify.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.10.23
# Version....: v0.2.0
# Purpose....: Look at one version: servers, smoke, patch level - changes
#              nothing but the server state.
# Notes......: Starts AdminServer and managed server when they are down (since
#              v0.2.0, log review 2026-11-04: a stopped host made verify fail
#              although the patch was fine). It changes no home, no domain
#              setting and no patch; the smoke test redeploys nothing when the
#              application is already there.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Derive the layout
  ansible.builtin.include_tasks: vars.yml

- name: Write the REST credentials for curl
  become: true
  ansible.builtin.template:
    src: curl.cfg.j2
    dest: "{{ wv_curl_cfg }}"
    owner: "{{ oracle_os_user }}"
    group: "{{ oracle_os_group_install }}"
    mode: "0600"
  no_log: true

# A host that was stopped overnight has no running server, and the smoke test
# then fails although nothing is wrong with the patch (14.1.2, 2026-11-04).
# servers.yml only starts what is not RUNNING - on a running domain a no-op.
- name: Start the servers that are not running
  ansible.builtin.include_tasks: servers.yml
  vars:
    wv_action: start

- name: Smoke test
  ansible.builtin.include_tasks: smoke.yml

- name: Record the current patch level
  ansible.builtin.include_tasks: snapshot.yml
  vars:
    wv_snap: current

- name: Write the report
  ansible.builtin.include_tasks: report.yml
  vars:
    wv_phase: verify
