---
# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: tasks/oneoffs.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.11.23
# Version....: v0.2.1
# Purpose....: Apply or roll back the one-off patches a CPU names next to the SPB.
# Notes......: Input: wls.oneoffs_target (object names p<id>_<tag>_Generic.zip,
#              from the cpu-patch-tests lab profile), wv_oneoff_action
#              (apply | rollback). Some fixes of a CPU ship outside the SPB
#              (CPU450, November 2026: OPSS 40154178 / 40154045, third-party
#              40288205) - SPBAT does not know them, so OPatch applies them after
#              the SPB, with the servers down, and rolls them back before it.
#              The applied ids are kept in <stage>/.oneoffs-applied: rollback
#              takes exactly those, in reverse order.
#              v0.2.0: "opatch prereq CheckApplicable" first. A patch OPatch
#              reports as not applicable to this home (e.g. OPSS on a plain
#              WebLogic Server install) is not applied and does not fail the
#              run - it is named in the evidence (wv_oneoff_result: id, install
#              type, verdict, OPatch output), never skipped in silence.
#              v0.2.1: the result is reset per version (14.1.1 carried the
#              12.2.1.4 result), an apply that ends in "no patches to apply"
#              is not applicable rather than applied (OPSS on plain WebLogic
#              Server 14.1.2 passes CheckApplicable, then skips every
#              component), and rollback takes only marker ids that are in the
#              home and names the others.
# Reference..: https://github.com/oehrlis/oci-labs
# License....: Apache License Version 2.0
# ------------------------------------------------------------------------------

- name: Name the one-off patches - {{ wls.version }}
  ansible.builtin.set_fact:
    wv_oneoff_result: []
    wv_oneoffs: "{{ wls.oneoffs_target | default([]) }}"
    wv_oneoff_ids: >-
      {{ (wls.oneoffs_target | default([])) | map('regex_replace', '^p([0-9]+)_.*$', '\1') | list }}

- name: Apply the one-off patches
  when:
    - wv_oneoff_action == 'apply'
    - wv_oneoffs | length > 0
  block:
    - name: Create the one-off directory
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.file:
        path: "{{ wv_stage }}/oneoffs"
        state: directory
        mode: "0750"

    - name: Unpack each one-off patch
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.unarchive:
        src: "{{ wv_stage }}/{{ item }}"
        dest: "{{ wv_stage }}/oneoffs"
        remote_src: true
      loop: "{{ wv_oneoffs }}"

    - name: OPatch CheckApplicable - {{ wv_oneoff_ids | join(', ') }}
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.command:
        cmd: >-
          {{ wv_home }}/OPatch/opatch prereq CheckApplicable
          -ph {{ wv_stage }}/oneoffs/{{ item }} -oh {{ wv_home }}
      environment:
        ORACLE_HOME: "{{ wv_home }}"
        JAVA_HOME: "{{ wv_jdk }}"
        CLASSPATH: ""
      loop: "{{ wv_oneoff_ids }}"
      register: wv_oneoff_check
      changed_when: false
      failed_when: false

    - name: Sort the one-off patches by applicability
      ansible.builtin.set_fact:
        wv_oneoff_apply_ids: >-
          {{ wv_oneoff_check.results
             | selectattr('rc', 'equalto', 0)
             | selectattr('stdout', 'search', '(?i)checkApplicable.*passed')
             | map(attribute='item') | list }}
        wv_install_type: >-
          {{ 'Fusion Middleware Infrastructure' if 'infrastructure' in (wls.installer_zip | default(''))
             else 'WebLogic Server' }}

    - name: Name the one-off patches that are not applicable to this home
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} not applicable to {{ wv_home }} ({{ wv_install_type }}):
          {{ (item.stdout_lines | default([]))[-6:] | join(' | ') }}
      loop: "{{ wv_oneoff_check.results | rejectattr('item', 'in', wv_oneoff_apply_ids) | list }}"
      loop_control:
        label: "{{ item.item }}"

    # The order of the profile is the order of the CPU document.
    - name: OPatch apply - {{ wv_oneoff_apply_ids | join(', ') }}
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.command:
        cmd: "{{ wv_home }}/OPatch/opatch apply -silent -oh {{ wv_home }}"
        chdir: "{{ wv_stage }}/oneoffs/{{ item }}"
      environment:
        ORACLE_HOME: "{{ wv_home }}"
        JAVA_HOME: "{{ wv_jdk }}"
        CLASSPATH: ""
      loop: "{{ wv_oneoff_apply_ids }}"
      register: wv_oneoff_apply
      changed_when: wv_oneoff_apply.rc == 0
      async: "{{ wls_async_timeout }}"
      poll: "{{ wls_async_poll }}"

    # OPatch exits 0 with "there are no patches to apply" when every component
    # of the patch is missing from the home - nothing was installed.
    - name: Name the one-off patches OPatch really applied
      ansible.builtin.set_fact:
        wv_oneoff_applied_ids: >-
          {{ (wv_oneoff_apply.results | default([]))
             | selectattr('rc', 'equalto', 0)
             | rejectattr('stdout', 'search', '(?i)no patches to apply')
             | map(attribute='item') | list }}

    - name: Record the one-off result for the evidence
      ansible.builtin.set_fact:
        wv_oneoff_result: >-
          {%- set out = [] -%}
          {%- for c in wv_oneoff_check.results -%}
            {%- set a = (wv_oneoff_apply.results | default([])) | selectattr('item', 'equalto', c.item) | list -%}
            {%- set _ = out.append({
                  'patch': c.item,
                  'install_type': wv_install_type,
                  'verdict': ('applied' if c.item in wv_oneoff_applied_ids else
                              ('not applicable (missing components)'
                               if (a | length > 0 and a[0].rc == 0) else
                               ('apply failed' if a | length > 0 else 'not applicable'))),
                  'opatch': ((a[0].stdout_lines if a | length > 0 else c.stdout_lines) | default([]))[-6:],
                }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Report the one-off result
      ansible.builtin.debug:
        msg: "{{ wv_oneoff_result | map(attribute='patch') | zip(wv_oneoff_result | map(attribute='verdict')) | list }}"

    - name: Record the applied one-off patches
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.copy:
        dest: "{{ wv_stage }}/.oneoffs-applied"
        content: "{{ wv_oneoff_applied_ids | join('\n') }}\n"
        mode: "0640"

- name: Roll the one-off patches back
  when: wv_oneoff_action == 'rollback'
  block:
    - name: Read the applied one-off patches
      become: true
      ansible.builtin.slurp:
        src: "{{ wv_stage }}/.oneoffs-applied"
      register: wv_oneoff_marker
      failed_when: false

    - name: List the patches in the home
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.command:
        cmd: "{{ wv_home }}/OPatch/opatch lspatches -oh {{ wv_home }}"
      environment:
        ORACLE_HOME: "{{ wv_home }}"
        JAVA_HOME: "{{ wv_jdk }}"
        CLASSPATH: ""
      register: wv_oneoff_lspatches
      changed_when: false
      when: wv_oneoff_marker.content is defined

    # split() on whitespace: a '\n' inside a folded scalar reaches Jinja as a
    # backslash and an n, so split('\n') never split a multi-id marker.
    - name: Name the one-off patches to roll back
      ansible.builtin.set_fact:
        wv_oneoff_marked: "{{ (wv_oneoff_marker.content | default('') | b64decode).split() | reverse | list }}"
        wv_oneoff_present: >-
          {{ (wv_oneoff_lspatches.stdout_lines | default([]))
             | map('regex_search', '^([0-9]+);', '\1') | select | flatten | list }}

    - name: Split the marked one-off patches by presence in the home
      ansible.builtin.set_fact:
        wv_oneoff_rb: "{{ wv_oneoff_marked | select('in', wv_oneoff_present) | list }}"
        wv_oneoff_absent: "{{ wv_oneoff_marked | reject('in', wv_oneoff_present) | list }}"

    - name: Name the marked one-off patches that are not in the home
      ansible.builtin.debug:
        msg: >-
          {{ wv_oneoff_absent | join(', ') }} marked as applied but not in
          {{ wv_home }} (opatch lspatches) - nothing to roll back for them.
      when: wv_oneoff_absent | length > 0

    - name: OPatch rollback - {{ wv_oneoff_rb | join(', ') }}
      become: true
      become_user: "{{ oracle_os_user }}"
      ansible.builtin.command:
        cmd: "{{ wv_home }}/OPatch/opatch rollback -silent -id {{ item }} -oh {{ wv_home }}"
      environment:
        ORACLE_HOME: "{{ wv_home }}"
        JAVA_HOME: "{{ wv_jdk }}"
        CLASSPATH: ""
      loop: "{{ wv_oneoff_rb }}"
      register: wv_oneoff_rollback
      changed_when: wv_oneoff_rollback.rc == 0
      async: "{{ wls_async_timeout }}"
      poll: "{{ wls_async_poll }}"

    - name: Forget the applied one-off patches
      become: true
      ansible.builtin.file:
        path: "{{ wv_stage }}/.oneoffs-applied"
        state: absent
