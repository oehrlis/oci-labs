# ------------------------------------------------------------------------------
# OraDBA - Oracle Database Infrastructure and Security, 5630 Muri, Switzerland
# ------------------------------------------------------------------------------
# Name.......: lab-datasafe-demo.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.10.19
# Version....: v0.1.0
# Purpose....: Build the LRN6087 Data Safe demo host (datasafe-demo stack):
#              Podman, Oracle AI Database 26ai Free with FREEPDB1/ODBSEED/ODBREPO,
#              Data Safe service accounts, odb_datasafe, on-premises connector.
# Notes......: Inventory is generated by Terraform into
#              inventories/generated/datasafe-demo/hosts.yml (private IP only),
#              so every run goes through the Bastion tunnel: make dsdemo-tunnel,
#              the dsdemo-* targets add -e ansible_host=127.0.0.1 -e ansible_port=2222.
#
#              Secrets come from a 0600 vars file (make dsdemo-install builds
#              it from terraform output and op read), never from -e key=value.
#
# Usage:
#   make dsdemo-tunnel
#   make dsdemo-install
#   make dsdemo-step TAG=container
#   Tags: prereq, odb_datasafe, container, ds_prereqs, connector, verify
# ------------------------------------------------------------------------------

- name: LRN6087 Data Safe demo host
  hosts: dsdemo_hosts
  # Facts after the Python bootstrap - OL8 ships 3.6, ansible-core needs 3.8+.
  gather_facts: false

  vars:
    # Bastion tunnel on a reused local port: no host key pinning (see
    # lab-cpu-patch.yml for the reasoning).
    ansible_ssh_common_args: >-
      -o ServerAliveInterval=60 -o ServerAliveCountMax=30
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o IdentitiesOnly=yes -o LogLevel=ERROR

  pre_tasks:
    - name: Wait for SSH on the demo host
      ansible.builtin.raw: echo ready
      register: dsdemo_ssh_ready
      retries: 60
      delay: 10
      until: dsdemo_ssh_ready is succeeded
      changed_when: false
      tags:
        - always

    - name: Bootstrap a supported Python interpreter
      ansible.builtin.raw: |
        set -eu
        if [ ! -x {{ ansible_python_interpreter | default('/usr/bin/python3.11') }} ]; then
          sudo dnf install -y -q python3.11
        fi
      register: dsdemo_python_bootstrap
      changed_when: "'Installed' in (dsdemo_python_bootstrap.stdout | default(''))"
      tags:
        - always

    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - always

    - name: Report the demo parameters
      ansible.builtin.debug:
        msg:
          - "Host.........: {{ inventory_hostname }} ({{ dsdemo_host_private_ip | default('n/a') }})"
          - "Database.....: {{ oracle_sid }} with {{ dsdemo_pdbs | join(', ') }}"
          - "Live PDB.....: {{ dsdemo_new_pdb }} (created by demo.sh prepare)"
          - "Connector....: {{ dsdemo_connector_name }} (instance principal: {{ dsdemo_instance_principal }})"
      tags:
        - always

  roles:
    - role: common
      become: true
      tags:
        - install
        - prereq
    - role: datasafe_demo
