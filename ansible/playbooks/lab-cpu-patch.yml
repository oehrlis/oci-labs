# Name.......: lab-cpu-patch.yml
# Author.....: Stefan Oehrli (oes) stefan.oehrli@oradba.ch
# Date.......: 2026.08.19
# Version....: v0.1.0
# Purpose....: Build and patch the Oracle CPU test lab (cpu-patch-test stack).
# Notes......: Inventory is generated by Terraform into
#              inventories/generated/cpu-patch-test/hosts.yml and carries
#              oracle_sid, db_base_ru, db_target_ru and both ORACLE_HOME paths
#              as group vars - the patch level is defined once, in Terraform.
#
#              Requires: ansible.posix (selinux, firewalld)
#                ansible-galaxy collection install -r requirements.yml
#
# Usage:
#   INV=inventories/generated/cpu-patch-test/hosts.yml
#
#   # Generic phase - one-off lab build
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags install \
#     -e mos_username="$(op read 'op://secrets/Oracle-MOS/username')" \
#     -e mos_password="$(op read 'op://secrets/Oracle-MOS/password')" \
#     -e db19_sys_password="$(op read 'op://secrets/<cpu-lab-db>/password')"
#
#   # Step by step, for manual testing on a VM
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags prereq
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags oradba
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags autoupgrade
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags credentials -e ...
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags download
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags create_home
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags create_db -e ...
#
#   # Quarterly CPU test
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags patch -e ...
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags verify
#
#   # Override the lab database name
#   ansible-playbook -i $INV playbooks/lab-cpu-patch.yml --tags install \
#     -e oracle_sid=TDB19 ...
# ------------------------------------------------------------------------------

- name: Oracle 19c CPU patch test lab
  hosts: cpu_patch_hosts
  # Facts are gathered explicitly after the Python bootstrap below. Oracle Linux
  # 8 ships Python 3.6, but ansible-core 2.18+ needs 3.8+ on the managed node -
  # gathering facts first would fail with
  # "SyntaxError: future feature annotations is not defined".
  gather_facts: false

  # Long-running AutoUpgrade jobs: keep the connection alive and do not let a
  # single slow task look like a hung host.
  vars:
    # UserKnownHostsFile=/dev/null on top of StrictHostKeyChecking=no: with a
    # Bastion port-forwarding tunnel every lab host answers on the same
    # 127.0.0.1:2222, so a recorded host key belongs to whichever instance came
    # first and every replacement then trips "REMOTE HOST IDENTIFICATION HAS
    # CHANGED". Pinning a host key to a reused local port carries no security
    # value - the identity that matters is enforced by the Bastion session and
    # the lab keypair. StrictHostKeyChecking=no alone does not help here,
    # because a *conflicting* entry is refused regardless.
    ansible_ssh_common_args: >-
      -o ServerAliveInterval=60 -o ServerAliveCountMax=30
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o LogLevel=ERROR

  pre_tasks:
    # A freshly applied instance is RUNNING before sshd accepts connections, so
    # "make cpu-lab-cycle" used to die on "Connection refused" right after
    # terraform apply. Wait instead of failing - this is the very first task, so
    # it also covers the reboot in a resize.
    # ansible.builtin.raw, NOT wait_for_connection: the latter runs the ping
    # module, which needs a Python interpreter that the next task is only about
    # to install - on a fresh host it can never succeed. raw needs nothing but
    # sshd, and unlike a bare port check it also rides out the boot window in
    # which sshd answers but pam_nologin still rejects the login.
    - name: Wait for SSH on the lab host
      ansible.builtin.raw: echo ready
      register: db19_ssh_ready
      retries: 60
      delay: 10
      until: db19_ssh_ready is succeeded
      changed_when: false
      tags:
        - always

    # ansible.builtin.raw runs over plain SSH and needs no Python on the target,
    # so it can bootstrap the interpreter that every later module depends on.
    - name: Bootstrap a supported Python interpreter
      ansible.builtin.raw: |
        set -eu
        if [ ! -x {{ ansible_python_interpreter | default('/usr/bin/python3.11') }} ]; then
          sudo dnf install -y -q {{ db19_python_package | default('python3.11') }}
        fi
      register: db19_python_bootstrap
      changed_when: "'Installed' in (db19_python_bootstrap.stdout | default(''))"
      tags:
        - always

    - name: Gather facts
      ansible.builtin.setup:
      tags:
        - always

    - name: Report the lab parameters
      ansible.builtin.debug:
        msg:
          - "Host.........: {{ inventory_hostname }} ({{ ansible_host | default('n/a') }})"
          - "Database.....: {{ oracle_sid }}"
          - "Base RU......: {{ db_base_ru }} -> {{ oracle_home_base }}"
          - "Target RU....: {{ db_target_ru }} -> {{ oracle_home_target }}"
      tags:
        - always

  roles:
    # common and base_ssh have no per-task become - they expect to be run
    # privileged. db19_engineering sets become per task instead, so it is not
    # escalated wholesale here.
    - role: common
      become: true
      tags:
        - install
        - prereq
    - role: base_ssh
      become: true
      tags:
        - install
        - prereq
    - role: db19_engineering
