[defaults]
inventory      = inventories/generated
roles_path     = ./roles
# ./collections first: oradba.automation is installed there, pinned by sha256
# (make cpu-lab-coll-install). The user and system paths stay as fallback for
# ansible.posix and ansible.windows.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

# Facts are addressed as ansible_facts['name'] only, never as the injected
# top-level ansible_<name> variables. Ansible deprecated that injection and will
# flip this default; pinning it to False now means a missed reference fails loudly
# here instead of silently working until the default changes under us.
inject_facts_as_vars = False

[ssh_connection]
# A dead Bastion tunnel used to hang a run: the async poll sat on a channel that
# no longer went anywhere (2026-11-19, two hosts, over two hours). The playbooks
# now give up on a silent channel after 2 min (ServerAlive 15 s x 8), and ssh
# exit 255 is retried here with Ansible's backoff (1, 3, 7, 15, 30 s ...), about
# 3.5 min in all - long enough for the tunnel supervisor (Makefile,
# cpu-lab-bastion-tunnel) to bring the forward back.
retries = 10
