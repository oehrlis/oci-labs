[defaults]
inventory      = inventories/generated
roles_path     = ./roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

# Facts are addressed as ansible_facts['name'] only, never as the injected
# top-level ansible_<name> variables. Ansible deprecated that injection and will
# flip this default; pinning it to False now means a missed reference fails loudly
# here instead of silently working until the default changes under us.
inject_facts_as_vars = False
